<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinf Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Segoe UI,Roboto,sans-serif;background:#e9e4f5;height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;background:#f7f5fc}
header{background:linear-gradient(135deg,#7b4dff,#b04dff);color:#fff;padding:14px 18px}
header b{font-size:18px}
#status{display:block;font-size:12px;margin-top:2px}
#messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;background:#fff;color:#222;align-self:flex-start;word-wrap:break-word}
.msg.me{align-self:flex-end;background:#7b4dff;color:#fff}
.n{font-size:12px;font-weight:700;color:#7b4dff}
.msg.me .n{display:none}
.t{font-size:10px;opacity:.6;text-align:right}
.bar{display:flex;gap:8px;padding:10px;background:#fff}
.bar input{flex:1;border:1px solid #ddd3f5;border-radius:22px;padding:12px 16px;font-size:15px;outline:0}
.bar button{width:46px;height:46px;border:0;border-radius:50%;background:#7b4dff;color:#fff;font-size:18px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#7b4dff,#b04dff);display:flex;align-items:center;justify-content:center}
.box{background:#fff;padding:28px;border-radius:22px;width:88%;max-width:330px;text-align:center}
.box h2{color:#333;margin-bottom:12px}
.box input{width:100%;border:1px solid #ddd3f5;border-radius:12px;padding:13px;font-size:15px;text-align:center;outline:0;margin-bottom:12px}
.box button{width:100%;padding:13px;border:0;border-radius:12px;background:#7b4dff;color:#fff;font-size:16px}
</style>
</head>
<body>
<div id="login">
<div class="box">
<h2>Sinf Chat</h2>
<input id="nameInput" maxlength="20" placeholder="Ismingiz" autocomplete="off">
<button type="button" onclick="enterChat()">Kirish</button>
</div>
</div>
<div class="app">
<header><b>Sinf Chat</b><span id="status">ulanmoqda...</span></header>
<div id="messages"></div>
<div class="bar">
<input id="input" autocomplete="off" placeholder="Xabar yozing...">
<button type="button" onclick="sendMsg()">&gt;</button>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
var myName = '';
var st = document.getElementById('status');
var socket = null;
window.onerror = function (m) { st.textContent = 'Xato: ' + m; };
if (typeof io === 'undefined') {
  st.textContent = 'Xato: server bilan aloqa yoq';
} else {
  socket = io();
  socket.on('connect', function () { st.textContent = 'ulandi'; });
  socket.on('disconnect', function () { st.textContent = 'uzildi'; });
  socket.on('chat message', function (d) {
    var div = document.createElement('div');
    div.className = 'msg' + (d.name === myName ? ' me' : '');
    var dt = new Date(d.time);
    var hm = ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
    var a = document.createElement('div'); a.className = 'n'; a.textContent = d.name;
    var b = document.createElement('div'); b.textContent = d.text;
    var c = document.createElement('div'); c.className = 't'; c.textContent = hm;
    div.appendChild(a); div.appendChild(b); div.appendChild(c);
    var box = document.getElementById('messages');
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}
function enterChat() {
  var n = document.getElementById('nameInput').value.trim();
  if (!n) return;
  myName = n;
  document.getElementById('messages').innerHTML = '';
  if (socket) socket.emit('join');
  document.getElementById('login').style.display = 'none';
  document.getElementById('input').focus();
}
function sendMsg() {
  var inp = document.getElementById('input');
  var t = inp.value.trim();
  if (!t || !socket) return;
  socket.emit('chat message', { name: myName, text: t });
  inp.value = '';
}
document.getElementById('nameInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') enterChat(); });
document.getElementById('input').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendMsg(); });
</script>
</body>
</html>
